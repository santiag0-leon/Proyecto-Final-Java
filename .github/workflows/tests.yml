name: Pruebas JUnit

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar JUnit
        run: |
          mkdir lib
          curl -L -o lib/junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compilar
        run: |
          mkdir out
          javac -cp lib/junit.jar -d out Modelo/*.java test/Modelo/*.java

      - name: Ejecutar pruebas
        run: java -jar lib/junit.jar execute -cp out --scan-classpath
